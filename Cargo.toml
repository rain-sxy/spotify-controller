[package]
name = "spotify_controller"
version = "0.1.0"
edition = "2024"

[dependencies]
termion = "4.0.6"
rspotify = { version = "0.16.1", features = ["cli"] }
serde = "1.0.229"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time", "sync"] }
toml = "1.1.8"
futures = "0.3.34"
chrono = "0.4"
libc = "0.2"
unicode-width = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = "0.12"
rustfft = "6"
base64 = "0.22"
serde_json = "1"
mpris = "2.1.0"
